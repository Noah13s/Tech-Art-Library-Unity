    <title>My first three.js app</title>
    <style>
      body { margin: 0; }

    <link rel="stylesheet" href="style.css">

    <script type="importmap">

  <body>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/scene.js"></script>
    <script type="module" src="js/websocket.js"></script>
    <script>
      // Toggle the collapsible panel
      function togglePanel() {
          const panelContentDiv = document.getElementById('panelContent');
          panelContentDiv.classList.toggle('collapsed');
      }
    </script>
  </body>
  
</html>
